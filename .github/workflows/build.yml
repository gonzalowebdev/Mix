name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            python3 - <<'PY'
          import re
          lines = open('build.log', errors='replace').read().splitlines()
          keep = []
          for i, l in enumerate(lines):
              if l.startswith('e: ') or 'error:' in l or 'What went wrong' in l or 'Execution failed' in l:
                  keep.append(l.strip()[:400])
                  if 'What went wrong' in l or 'Execution failed' in l:
                      keep.extend(x.strip()[:400] for x in lines[i+1:i+4])
          msg = '\n'.join(keep[:60]) or '\n'.join(lines[-40:])
          msg = msg.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print('::error title=Errores de compilacion::' + msg)
          PY
          fi
          exit $code

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk Mix.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mix-apk
          path: Mix.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mix build ${{ github.run_number }}
          files: Mix.apk
